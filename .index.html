<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>發票整理管家</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- FontAwesome 圖示 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">

  <!-- 頂部導覽列 -->
  <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <i class="fa-solid font-bold fa-receipt text-2xl"></i>
        <h1 class="text-xl font-bold tracking-wide">發票整理管家</h1>
      </div>
      <button onclick="openApiModal()" class="text-xs bg-indigo-700 hover:bg-indigo-800 text-indigo-100 px-3 py-1.5 rounded-lg border border-indigo-500 transition flex items-center space-x-1">
        <i class="fa-solid fa-key"></i>
        <span id="apiKeyBtnText">設定 API Key</span>
      </button>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 mt-6 grid grid-cols-1 md:grid-cols-12 gap-6">

    <!-- 左側邊欄 / 新增發票區塊 (4 cols) -->
    <section class="md:col-span-5 lg:col-span-4 space-y-6">
      <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200">
        <h2 class="text-lg font-bold mb-4 text-slate-700 flex items-center border-b pb-2">
          <i class="fa-solid fa-wand-magic-sparkles text-indigo-500 mr-2"></i> 新增發票
        </h2>

        <!-- 上傳圖片區塊 -->
        <div id="dropZone" class="border-2 border-dashed border-indigo-200 hover:border-indigo-400 bg-indigo-50/50 hover:bg-indigo-50 rounded-xl p-4 text-center cursor-pointer transition relative group">
          <input type="file" id="fileInput" accept="image/*" class="hidden" onchange="handleFileSelect(event)">
          <div id="uploadPlaceholder" class="space-y-2">
            <i class="fa-solid fa-cloud-arrow-up text-3xl text-indigo-400 group-hover:scale-110 transition-transform"></i>
            <p class="text-sm font-medium text-slate-600">點擊或拖拽發票照片至此</p>
            <p class="text-xs text-slate-400">支援 JPG, PNG 圖片格式</p>
          </div>
          <div id="previewContainer" class="hidden relative">
            <img id="imagePreview" class="max-h-48 mx-auto rounded-lg shadow-sm border" alt="發票預覽">
            <button type="button" onclick="resetImage(event)" class="absolute top-1 right-1 bg-slate-800/70 hover:bg-slate-800 text-white w-6 h-6 rounded-full text-xs flex items-center justify-center">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>
        </div>

        <!-- AI 辨識按鈕 -->
        <button id="aiBtn" onclick="analyzeReceipt()" class="w-full mt-3 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 px-4 rounded-xl shadow-sm hover:shadow transition flex items-center justify-center space-x-2 disabled:opacity-50">
          <i class="fa-solid fa-robot"></i>
          <span>Gemini AI 自動辨識</span>
        </button>

        <!-- 讀取狀態提示 -->
        <div id="loadingStatus" class="hidden text-center py-3 text-indigo-600 text-sm font-medium animate-pulse flex items-center justify-center space-x-2">
          <i class="fa-solid fa-circle-notch fa-spin"></i>
          <span>AI 正在分析發票明細中...</span>
        </div>

        <hr class="my-5 border-slate-100">

        <!-- 發票資訊表單 -->
        <form id="receiptForm" onsubmit="saveReceipt(event)" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">消費日期</label>
            <input type="date" id="dateInput" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-400 outline-none">
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">商家名稱</label>
            <input type="text" id="storeInput" placeholder="例如：全家便利商店" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-400 outline-none">
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">消費分類</label>
              <select id="categoryInput" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-400 outline-none bg-white">
                <option value="餐飲食品">餐飲食品</option>
                <option value="日常用品">日常用品</option>
                <option value="交通出行">交通出行</option>
                <option value="休閒娛樂">休閒娛樂</option>
                <option value="數位訂閱">數位訂閱</option>
                <option value="醫療保健">醫療保健</option>
                <option value="其他">其他</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">總金額 ($)</label>
              <input type="number" id="amountInput" min="0" placeholder="0" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-400 outline-none">
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">購買明細/備註</label>
            <textarea id="itemsInput" rows="2" placeholder="例如：美式咖啡 x 1, 鮮奶 x 1" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-400 outline-none"></textarea>
          </div>

          <button type="submit" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-medium py-2.5 px-4 rounded-xl shadow transition">
            儲存發票紀錄
          </button>
        </form>
      </div>
    </section>

    <!-- 右側主要數據統計與列表 (8 cols) -->
    <section class="md:col-span-7 lg:col-span-8 space-y-6">

      <!-- 統計數字卡片 -->
      <div class="grid grid-cols-2 gap-4">
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
          <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">本月累積消費</p>
          <div class="text-2xl lg:text-3xl font-extrabold text-indigo-600" id="monthlyTotal">$0</div>
        </div>
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
          <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">歷史總計金額</p>
          <div class="text-2xl lg:text-3xl font-extrabold text-slate-700" id="grandTotal">$0</div>
        </div>
      </div>

      <!-- 圖表儀表板 (圓餅圖 + 長條圖) -->
      <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-4">
        <h2 class="text-lg font-bold text-slate-700 flex items-center border-b pb-2">
          <i class="fa-solid fa-chart-pie text-indigo-500 mr-2"></i> 消費統計分析
        </h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-center">
          <div>
            <p class="text-xs font-semibold text-slate-400 text-center mb-2">支出分類占比</p>
            <div class="relative h-48">
              <canvas id="categoryChart"></canvas>
            </div>
          </div>
          <div>
            <p class="text-xs font-semibold text-slate-400 text-center mb-2">每月消費趨勢</p>
            <div class="relative h-48">
              <canvas id="monthlyTrendChart"></canvas>
            </div>
          </div>
        </div>
      </div>

      <!-- 發票記錄列表 -->
      <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
        <div class="flex justify-between items-center mb-4 border-b pb-2">
          <h2 class="text-lg font-bold text-slate-700 flex items-center">
            <i class="fa-solid fa-list-check text-indigo-500 mr-2"></i> 發票記錄清單
          </h2>
          <span id="recordCount" class="text-xs font-semibold bg-slate-100 text-slate-500 px-2.5 py-1 rounded-full">共 0 筆</span>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm text-slate-600">
            <thead class="text-xs text-slate-400 uppercase border-b bg-slate-50/50">
              <tr>
                <th class="py-2.5 px-3">日期</th>
                <th class="py-2.5 px-3">商家</th>
                <th class="py-2.5 px-3">分類</th>
                <th class="py-2.5 px-3">明細</th>
                <th class="py-2.5 px-3 text-right">金額</th>
                <th class="py-2.5 px-3 text-center">操作</th>
              </tr>
            </thead>
            <tbody id="receiptListTable" class="divide-y divide-slate-100">
              <!-- 動態渲染清單 -->
            </tbody>
          </table>
          <div id="emptyState" class="text-center py-8 text-slate-400">
            <i class="fa-regular fa-folder-open text-3xl mb-2"></i>
            <p class="text-sm">目前尚無發票記錄</p>
          </div>
        </div>
      </div>

    </section>
  </main>

  <!-- Modal: API Key 設定 -->
  <div id="apiModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl border space-y-4">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 class="font-bold text-slate-700 flex items-center">
          <i class="fa-solid fa-key text-indigo-500 mr-2"></i> 設定 Gemini API Key
        </h3>
        <button onclick="closeApiModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <p class="text-xs text-slate-500 leading-relaxed">
        影像辨識功能需要 Google Gemini API 金鑰。金鑰只會存放在您本地瀏覽器中，不會傳送至任何第三方伺服器。
      </p>
      <div>
        <input type="password" id="apiKeyInput" placeholder="貼上 AIZA... 開頭的金鑰" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-400 outline-none">
      </div>
      <div class="flex justify-end space-x-2 pt-2">
        <button onclick="closeApiModal()" class="px-4 py-2 text-xs font-medium text-slate-500 hover:bg-slate-100 rounded-lg">取消</button>
        <button onclick="saveApiKey()" class="px-4 py-2 text-xs font-medium bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg">儲存設定</button>
      </div>
    </div>
  </div>

  <script>
    // ===== 全局狀態與初始化 =====
    let receipts = JSON.parse(localStorage.getItem('receipts') || '[]');
    let currentBase64Image = null;
    let categoryChartInstance = null;
    let monthlyTrendChartInstance = null;

    document.addEventListener('DOMContentLoaded', () => {
      // 預設日期設為今天
      document.getElementById('dateInput').valueAsDate = new Date();
      updateApiKeyStatus();
      renderApp();
      setupDragAndDrop();
    });

    // ===== API Key 設定管理 =====
    function openApiModal() {
      document.getElementById('apiKeyInput').value = localStorage.getItem('gemini_api_key') || '';
      document.getElementById('apiModal').classList.remove('hidden');
    }

    function closeApiModal() {
      document.getElementById('apiModal').classList.add('hidden');
    }

    function saveApiKey() {
      const key = document.getElementById('apiKeyInput').value.trim();
      if (key) {
        localStorage.setItem('gemini_api_key', key);
      } else {
        localStorage.removeItem('gemini_api_key');
      }
      updateApiKeyStatus();
      closeApiModal();
    }

    function updateApiKeyStatus() {
      const key = localStorage.getItem('gemini_api_key');
      const btnText = document.getElementById('apiKeyBtnText');
      if (key) {
        btnText.innerText = 'API Key 已設定';
      } else {
        btnText.innerText = '設定 API Key';
      }
    }

    // ===== 圖片上傳與拖拽處理 =====
    function setupDragAndDrop() {
      const dropZone = document.getElementById('dropZone');
      const fileInput = document.getElementById('fileInput');

      dropZone.addEventListener('click', () => fileInput.click());

      ['dragenter', 'dragover'].forEach(eventName => {
        dropZone.addEventListener(eventName, (e) => {
          e.preventDefault();
          dropZone.classList.add('border-indigo-500', 'bg-indigo-100');
        });
      });

      ['dragleave', 'drop'].forEach(eventName => {
        dropZone.addEventListener(eventName, (e) => {
          e.preventDefault();
          dropZone.classList.remove('border-indigo-500', 'bg-indigo-100');
        });
      });

      dropZone.addEventListener('drop', (e) => {
        const files = e.dataTransfer.files;
        if (files.length > 0) processFile(files[0]);
      });
    }

    function handleFileSelect(e) {
      if (e.target.files.length > 0) processFile(e.target.files[0]);
    }

    function processFile(file) {
      if (!file.type.startsWith('image/')) {
        alert('請上傳有效的圖片檔案！');
        return;
      }

      const reader = new FileReader();
      reader.onload = (e) => {
        currentBase64Image = e.target.result;
        document.getElementById('imagePreview').src = currentBase64Image;
        document.getElementById('uploadPlaceholder').classList.add('hidden');
        document.getElementById('previewContainer').classList.remove('hidden');
      };
      reader.readAsDataURL(file);
    }

    function resetImage(e) {
      if (e) e.stopPropagation();
      currentBase64Image = null;
      document.getElementById('fileInput').value = '';
      document.getElementById('uploadPlaceholder').classList.remove('hidden');
      document.getElementById('previewContainer').classList.add('hidden');
    }

    // ===== Gemini AI 發票辨識核心 =====
    async function analyzeReceipt() {
      const apiKey = localStorage.getItem('gemini_api_key');
      if (!apiKey) {
        alert('請先點擊右上角「設定 API Key」輸入您的 Google Gemini API Key。');
        openApiModal();
        return;
      }

      if (!currentBase64Image) {
        alert('請先上傳或拖拽發票照片！');
        return;
      }

      const aiBtn = document.getElementById('aiBtn');
      const loadingStatus = document.getElementById('loadingStatus');
      aiBtn.disabled = true;
      loadingStatus.classList.remove('hidden');

      try {
        const base64Data = currentBase64Image.split(',')[1];
        const mimeType = currentBase64Image.split(';')[0].split(':')[1];

        const prompt = `請分析這張發票/收據照片，並將辨識到的資訊以嚴格的 JSON 格式回傳，請勿加上 markdown 標籤或任何其他文字。格式如下：
{
  "date": "YYYY-MM-DD",
  "store": "商店名稱",
  "category": "分類 (請從以下選項擇一：餐飲食品, 日常用品, 交通出行, 休閒娛樂, 數位訂閱, 醫療保健, 其他)",
  "amount": 金額數字,
  "items": "購買品項摘要，多項請用頓號隔開"
}`;

        const payload = {
          contents: [{
            parts: [
              { text: prompt },
              { inline_data: { mime_type: mimeType, data: base64Data } }
            ]
          }]
        };

        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (!response.ok) throw new Error('API 請求失敗，請檢查 API Key 是否正確。');

        const result = await response.json();
        const rawText = result.candidates[0].content.parts[0].text.trim();
        
        // 清理 JSON 文字 (防止 AI 包裝 ```json)
        const cleanedJson = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
        const data = JSON.parse(cleanedJson);

        // 自動填入表單
        if (data.date) document.getElementById('dateInput').value = data.date;
        if (data.store) document.getElementById('storeInput').value = data.store;
        if (data.category) document.getElementById('categoryInput').value = data.category;
        if (data.amount) document.getElementById('amountInput').value = data.amount;
        if (data.items) document.getElementById('itemsInput').value = data.items;

      } catch (err) {
        console.error(err);
        alert('辨識失敗：' + err.message);
      } finally {
        aiBtn.disabled = false;
        loadingStatus.classList.add('hidden');
      }
    }

    // ===== CRUD 資料維護 =====
    function saveReceipt(e) {
      e.preventDefault();

      const newReceipt = {
        id: Date.now(),
        date: document.getElementById('dateInput').value,
        store: document.getElementById('storeInput').value.trim(),
        category: document.getElementById('categoryInput').value,
        amount: parseFloat(document.getElementById('amountInput').value) || 0,
        items: document.getElementById('itemsInput').value.trim()
      };

      receipts.unshift(newReceipt); // 最新在最前面
      localStorage.setItem('receipts', JSON.stringify(receipts));

      // 重設表單
      document.getElementById('receiptForm').reset();
      document.getElementById('dateInput').valueAsDate = new Date();
      resetImage();

      renderApp();
    }

    function deleteReceipt(id) {
      if (confirm('確定要刪除這筆發票紀錄嗎？')) {
        receipts = receipts.filter(r => r.id !== id);
        localStorage.setItem('receipts', JSON.stringify(receipts));
        renderApp();
      }
    }

    // ===== 畫面渲染與數據計算 =====
    function renderApp() {
      renderTable();
      renderStats();
      renderCharts();
    }

    function renderTable() {
      const tbody = document.getElementById('receiptListTable');
      const emptyState = document.getElementById('emptyState');
      document.getElementById('recordCount').innerText = `共 ${receipts.length} 筆`;

      if (receipts.length === 0) {
        tbody.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');
      tbody.innerHTML = receipts.map(r => `
        <tr class="hover:bg-slate-50 transition">
          <td class="py-3 px-3 whitespace-nowrap font-medium text-slate-700">${r.date}</td>
          <td class="py-3 px-3 font-semibold text-slate-800">${escapeHtml(r.store)}</td>
          <td class="py-3 px-3">
            <span class="inline-block px-2 py-0.5 text-xs rounded-md bg-indigo-50 text-indigo-600 font-medium">${r.category}</span>
          </td>
          <td class="py-3 px-3 text-xs text-slate-500 max-w-xs truncate">${escapeHtml(r.items || '-')}</td>
          <td class="py-3 px-3 text-right font-bold text-slate-800">$${r.amount.toLocaleString()}</td>
          <td class="py-3 px-3 text-center">
            <button onclick="deleteReceipt(${r.id})" class="text-slate-400 hover:text-rose-500 transition px-2 py-1">
              <i class="fa-regular fa-trash-can"></i>
            </button>
          </td>
        </tr>
      `).join('');
    }

    function renderStats() {
      const now = new Date();
      const currentYearMonth = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;

      const grandTotal = receipts.reduce((sum, r) => sum + r.amount, 0);
      const monthlyTotal = receipts
        .filter(r => r.date.startsWith(currentYearMonth))
        .reduce((sum, r) => sum + r.amount, 0);

      document.getElementById('grandTotal').innerText = `$${grandTotal.toLocaleString()}`;
      document.getElementById('monthlyTotal').innerText = `$${monthlyTotal.toLocaleString()}`;
    }

    // ===== 圖表繪製 (Chart.js) =====
    function renderCharts() {
      // 1. 分類圓餅圖數據
      const categoryTotals = {};
      receipts.forEach(r => {
        categoryTotals[r.category] = (categoryTotals[r.category] || 0) + r.amount;
      });

      const pieLabels = Object.keys(categoryTotals);
      const pieData = Object.values(categoryTotals);

      if (categoryChartInstance) categoryChartInstance.destroy();

      const ctxPie = document.getElementById('categoryChart').getContext('2d');
      categoryChartInstance = new Chart(ctxPie, {
        type: 'doughnut',
        data: {
          labels: pieLabels.length ? pieLabels : ['尚無資料'],
          datasets: [{
            data: pieData.length ? pieData : [1],
            backgroundColor: [
              '#6366f1', '#3b82f6', '#10b981', '#f59e0b', '#ec4899', '#8b5cf6', '#64748b'
            ]
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } } }
        }
      });

      // 2. 每月消費趨勢長條圖數據 (近 6 個月)
      const monthlyTotals = {};
      receipts.forEach(r => {
        const month = r.date.substring(0, 7); // YYYY-MM
        monthlyTotals[month] = (monthlyTotals[month] || 0) + r.amount;
      });

      const sortedMonths = Object.keys(monthlyTotals).sort().slice(-6);
      const barData = sortedMonths.map(m => monthlyTotals[m]);

      if (monthlyTrendChartInstance) monthlyTrendChartInstance.destroy();

      const ctxBar = document.getElementById('monthlyTrendChart').getContext('2d');
      monthlyTrendChartInstance = new Chart(ctxBar, {
        type: 'bar',
        data: {
          labels: sortedMonths.length ? sortedMonths : ['無資料'],
          datasets: [{
            label: '消費金額',
            data: barData.length ? barData : [0],
            backgroundColor: '#818cf8',
            borderRadius: 6
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            y: { beginAtZero: true, ticks: { font: { size: 10 } } },
            x: { ticks: { font: { size: 10 } } }
          }
        }
      });
    }

    // 安全字串跳脫
    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
